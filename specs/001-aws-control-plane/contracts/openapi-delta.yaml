# OpenAPI delta for the cluster-management surface.
#
# This is NOT a contract. The contract is internal/api/openapi.yaml, and per
# AGENTS.md and the constitution's Principle III there is exactly one. This file
# exists so the merge is mechanical rather than improvised: block 1 is inserted
# under the top-level `paths:` key, block 2 under `components:`, both immediately
# before the `components:` key / at the end of the respective mapping.
#
# House style copied from the existing file: flow mappings on one line where they
# fit, `type: [string, "null"]` for nullable (OpenAPI 3.1), `default:
# { $ref: "#/components/responses/Error" }` on every operation, and small wrapper
# responses written as inline `type: object` rather than a named schema.
#
# Path parameters are `name` and `node`, never `id` — see contracts/cluster-routes.md.

# ---------------------------------------------------------------- block 1: paths

  /v1/control-plane:
    get:
      description: >
        Capability probe. Tells the dashboard which navigation to render; a
        cluster returns control_plane false.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlPlane" }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers:
    get:
      description: Providers this control plane can provision with. Phase one is AWS only.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers/{provider}/regions:
    parameters: [{ $ref: "#/components/parameters/provider" }]
    get:
      description: >
        Regions the named provider can provision in with the control plane's
        configured credential source. A provider that is not available in
        phase one is 400 provider_unavailable, never an empty list.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [regions]
                properties:
                  regions: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers/{provider}/instance-types:
    parameters: [{ $ref: "#/components/parameters/provider" }]
    get:
      description: >
        Host sizes the named provider offers, with the current price for the
        control plane's configured region. The list comes from the provider
        adapter, never from a table in this contract.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [instance_types, region]
                properties:
                  region:
                    type: string
                    description: >
                      The region these prices are for. One fact about the whole
                      response, not one per item, because a size is a catalogue
                      entry and the region was the argument to fetching it.
                  instance_types:
                    type: array
                    items: { $ref: "#/components/schemas/InstanceTypePrice" }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers/{provider}/estimate:
    parameters: [{ $ref: "#/components/parameters/provider" }]
    post:
      description: >
        Estimate the fixed charges for a configuration with the named provider.
        Creates nothing. The returned quote_id must be presented to
        POST /v1/clusters, which is what makes the price review the gate on
        spending money.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [region, instance_type, disk_gib]
              properties:
                region: { type: string }
                instance_type: { type: string }
                disk_gib: { type: integer, minimum: 20 }
                domain: { type: string, default: "" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters:
    get:
      description: Clusters this control plane manages. Never includes credentials.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }
    post:
      description: >
        Start provisioning a cluster. Returns the cluster in status provisioning;
        the dashboard polls GET /v1/clusters/{name} for phase changes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, region, instance_type, disk_gib, quote_id]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$" }
                region: { type: string }
                instance_type: { type: string }
                disk_gib: { type: integer, minimum: 20 }
                domain: { type: string, default: "" }
                quote_id:
                  type: string
                  description: "from POST /v1/providers/{provider}/estimate"
      responses:
        "200":
          description: the cluster, provisioning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      description: >
        Delete the cluster and its resources. 409 when workers are still present.
        Also used by automatic cleanup after a failed provisioning operation.
        Returns the cluster in status deleting, because the operator is told
        what is happening rather than left to guess.
      responses:
        "200":
          description: the cluster, deleting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/credentials:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    get:
      description: >
        The cluster's API key and administrator password, in plaintext. Admin
        only, audited as cluster.credentials.view, and the only response in the
        API that returns a secret. This is the route that replaces reading them
        off the host over SSH. The key is minted by the cluster itself once it
        accepts the injected password, so this returns 409 until the cluster
        reaches status ready.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterCredentials" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/rotate:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    post:
      description: >
        Mint a new administrator password and API key and re-deliver the password
        to the provider's secret channel. The running cluster keeps both old
        credentials until an operator applies the new ones. Admin only, audited.
      responses:
        "200":
          description: the rotated cluster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/nodes:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/ClusterNode" }
        default: { $ref: "#/components/responses/Error" }
    post:
      description: >
        Add a worker. 503 cluster_unavailable while the cluster is not ready.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [instance_type, disk_gib]
              properties:
                instance_type: { type: string }
                disk_gib: { type: integer, minimum: 20 }
      responses:
        "200":
          description: the node, provisioning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterNode" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/nodes/{node}:
    parameters:
      - { $ref: "#/components/parameters/clusterName" }
      - { name: node, in: path, required: true, schema: { type: string } }
    delete:
      description: >
        Remove a worker. 409 node_holds_sandboxes when it still holds
        sandboxes, with the count in the message.
      responses:
        "204": { description: removed }
        default: { $ref: "#/components/responses/Error" }

# ---------------------------------------------------------- block 2: components

# insert into `components.parameters`, alongside the existing `id` and `username`:

  clusterName: { name: name, in: path, required: true, schema: { type: string } }
  provider: { name: provider, in: path, required: true, schema: { type: string, enum: [aws] } }

# insert into `components.schemas`:

    ControlPlane:
      type: object
      required: [control_plane, providers, version]
      properties:
        control_plane: { type: boolean, description: true on a control plane, false on a cluster }
        providers: { type: array, items: { type: string } }
        version: { type: string }

    Provider:
      type: object
      required: [id, available]
      properties:
        id: { type: string, description: "aws | gcp | azure" }
        available: { type: boolean, description: false means the choice is visible but cannot provision }

    InstanceTypePrice:
      type: object
      required: [id, hourly_usd, monthly_usd]
      properties:
        id: { type: string }
        hourly_usd: { type: number }
        monthly_usd: { type: number }

    Estimate:
      type: object
      required: [quote_id, hourly_usd, monthly_usd, lines, excluded]
      properties:
        quote_id: { type: string, description: present this to POST /v1/clusters }
        hourly_usd: { type: number }
        monthly_usd: { type: number }
        lines:
          type: array
          description: fixed charges only, one row per resource
          items:
            type: object
            required: [label, hourly_usd, monthly_usd]
            properties:
              label: { type: string, description: "compute | storage | public_ipv4" }
              hourly_usd: { type: number }
              monthly_usd: { type: number }
        excluded:
          type: array
          description: charges deliberately not estimated, shown so the operator is not surprised
          items: { type: string }

    Cluster:
      type: object
      required: [name, provider, region, instance_type, disk_gib, domain, status, phase, detail, hourly_usd, monthly_usd, url, tls_pin, created, updated]
      properties:
        name: { type: string }
        provider: { type: string, description: the provider id; only aws is available in phase one }
        region: { type: string }
        instance_type: { type: string }
        disk_gib: { type: integer }
        domain: { type: string }
        status:
          type: string
          enum: [provisioning, ready, failed, deleting, deleted]
        phase: { type: string, description: current sub-step; empty unless provisioning }
        detail: { type: string, description: non-secret diagnostic from the bootstrap }
        hourly_usd: { type: number }
        monthly_usd: { type: number }
        url: { type: string, description: non-empty only when status is ready }
        tls_pin: { type: string, description: SHA-256 SPKI pin of the cluster certificate }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }

    ClusterCredentials:
      type: object
      required: [api_key, admin_password]
      # 409 credentials_not_ready until the cluster's status is ready: the key is
      # minted by the cluster, not injected, so it does not exist before then.
      properties:
        api_key: { type: string }
        admin_password: { type: string }
      description: >
        The only response in the API that returns plaintext secrets. Admin only,
        audited, and never included in a list.

    ClusterNode:
      type: object
      required: [id, instance_type, status, sandboxes, created]
      properties:
        id:
          type: string
          description: >
            Opaque worker handle from the provider, typed back into
            DELETE /v1/clusters/{name}/nodes/{node}. Returned to the
            operator because the removal URL needs it; never parsed
            or interpreted by the control plane.
        instance_type: { type: string }
        status: { type: string, enum: [provisioning, ready, failed, removing, removed] }
        detail: { type: string }
        sandboxes: { type: integer, description: last observed count; the cluster is the authority }
        created: { type: string, format: date-time }
