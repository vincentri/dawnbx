version: 2
# Plain binaries named <binary>-<os>-<arch> plus checksums.txt: the names
# install.sh --release-url and deploy/aws/dawnbx.yaml download.
builds:
  - id: server
    main: ./cmd/dawnbx-server
    binary: dawnbx-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X dawnbx/internal/api.Version={{ .Version }}"]
  - id: cli
    main: ./cmd/dawnbx
    binary: dawnbx
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: checksums.txt
release:
  extra_files:
    - glob: install.sh
    - glob: deploy/aws/dawnbx.yaml
changelog:
  disable: true
