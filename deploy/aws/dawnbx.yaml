AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  dawnbx on one EC2 instance (k3s + gVisor). HTTPS on <elastic-ip>.sslip.io or your
  domain. Secrets stay on the box; the SshCommand output prints them.

# Runs in the region's default VPC. Creating the stack takes ~5 min; if it fails,
# re-create with "Preserve successfully provisioned resources" (disable rollback)
# and read /var/log/cloud-init-output.log on the instance.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH key pair; the only way to read the API key and admin password.
  SshCidr:
    Type: String
    Description: Who may SSH in, e.g. your IP as 203.0.113.7/32.
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
  Domain:
    Type: String
    Default: ""
    Description: >-
      Optional. A name whose DNS A record you will point at the Elastic IP (output PublicIp).
      Empty uses <ip>.sslip.io. Set it if Let's Encrypt refuses sslip.io (rate limit).
  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues: [t4g.medium, t4g.large, t4g.xlarge, m7g.large, m7g.xlarge, m7g.2xlarge]
    Description: arm64 only (matches ImageId). ~25 idle sandboxes per 4 GB.
  CpuCredits:
    Type: String
    Default: standard
    AllowedValues: [standard, unlimited]
    Description: >-
      t4g only. standard = fixed price, CPU slows to 20% of a core per vCPU once
      burst credits run out. unlimited = full speed, extra CPU time billed.
  DiskGiB:
    Type: Number
    Default: 30
    MinValue: 20
    Description: Root disk; sandboxes' files live here (installer needs 10 GB free).
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  ReleaseUrl:
    Type: String
    Description: >-
      Base URL of a release (install.sh, checksums.txt, dawnbx-server-linux-arm64,
      dawnbx-linux-arm64), e.g. https://github.com/OWNER/dawnbx/releases/download/v0.1.0.
    AllowedPattern: ^https://.+[^/]$

Conditions:
  HasDomain: !Not [!Equals [!Ref Domain, ""]]
  Burstable: !Or
    - !Equals [!Ref InstanceType, t4g.medium]
    - !Equals [!Ref InstanceType, t4g.large]
    - !Equals [!Ref InstanceType, t4g.xlarge]

Resources:
  Ip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dawnbx; k3s ports (6443, 10250, WireGuard 51820) only between members
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  # Workers launched later into this group can join.
  SgK3s:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !GetAtt Sg.GroupId, SourceSecurityGroupId: !GetAtt Sg.GroupId, IpProtocol: tcp, FromPort: 6443, ToPort: 6443}
  SgKubelet:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !GetAtt Sg.GroupId, SourceSecurityGroupId: !GetAtt Sg.GroupId, IpProtocol: tcp, FromPort: 10250, ToPort: 10250}
  SgWireGuard:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !GetAtt Sg.GroupId, SourceSecurityGroupId: !GetAtt Sg.GroupId, IpProtocol: udp, FromPort: 51820, ToPort: 51820}

  Ready:
    Type: AWS::CloudFormation::WaitConditionHandle
  ReadyWait:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: IpAssoc
    Properties: {Handle: !Ref Ready, Timeout: "1200", Count: 1}

  Lt:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # IMDSv2 only, hop limit 1: pods can't reach instance metadata. No IAM role either.
        MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled}
        CreditSpecification: !If [Burstable, {CpuCredits: !Ref CpuCredits}, !Ref AWS::NoValue]

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: [!GetAtt Sg.GroupId]
      LaunchTemplate: {LaunchTemplateId: !Ref Lt, Version: !GetAtt Lt.LatestVersionNumber}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: !Ref DiskGiB, VolumeType: gp3, Encrypted: true}
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # A failed download happens before install.sh can report, so report it here.
            fail() { curl -s -X PUT -H 'Content-Type:' --data-binary "{\"Status\":\"FAILURE\",\"Reason\":\"$1\",\"UniqueId\":\"install\",\"Data\":\"\"}" '${Ready}'; exit 1; }
            cd /root
            curl -fsSL --retry 3 -o install.sh '${ReleaseUrl}/install.sh' || fail "download install.sh from ${ReleaseUrl} failed"
            # The Elastic IP is attached right after boot; wait so Let's Encrypt reaches this box.
            t=$(curl -s -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 300' http://169.254.169.254/latest/api/token)
            md() { curl -s -H "X-aws-ec2-metadata-token: $t" "http://169.254.169.254/latest/meta-data/$1"; }
            for _ in $(seq 60); do [ "$(md public-ipv4)" = '${Ip}' ] && break; sleep 5; done
            # Workers join from inside the VPC (the security group limits it further).
            cidr=$(md "network/interfaces/macs/$(md mac)/vpc-ipv4-cidr-block")
            # install.sh downloads the binaries and checks them against checksums.txt.
            bash install.sh --yes --domain '${Dom}' --allow-join "$cidr" --report '${Ready}' \
              --release-url '${ReleaseUrl}'
          - Dom: !If [HasDomain, !Ref Domain, !Sub "${Ip}.sslip.io"]
  IpAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties: {AllocationId: !GetAtt Ip.AllocationId, InstanceId: !Ref Server}

Outputs:
  Url:
    Value: !If [HasDomain, !Sub "https://${Domain}", !Sub "https://${Ip}.sslip.io"]
    Description: Dashboard and API (DAWNBX_URL).
  PublicIp:
    Value: !Ref Ip
    Description: Point your Domain's A record here.
  SshCommand:
    Value: !Sub "ssh ubuntu@${Ip} sudo cat /root/.dawnbx/env /var/lib/dawnbx/server/admin.env"
    Description: Prints DAWNBX_URL, DAWNBX_API_KEY and the admin password (user admin).
  SecurityGroup:
    Value: !GetAtt Sg.GroupId
    Description: Launch workers into this group, then run the join command from Settings > Nodes on them.
