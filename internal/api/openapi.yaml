openapi: 3.1.0
info:
  title: dawnbx
  version: v1
  description: |
    Self-hosted sandboxes for AI agents. Auth: `Authorization: Bearer dbx_...`
    (API keys) or the `dawnbx_session` cookie (dashboard). Cookie-authed writes
    need `X-Dawnbx: 1`. Errors are `{code, message, hint?}`.
    Terminal: `GET /v1/sandboxes/{id}/terminal` upgrades to a WebSocket
    (subprotocol `dawnbx`); binary frames are the tty, text frames
    `{"cols":N,"rows":N}` resize it. API errors close with 4000+status.
servers:
  - url: /
security:
  - bearer: []
  - cookie: []

paths:
  # /v1/version and /v1/logout carry no `default` Error response on purpose:
  # neither has an error path (internal/api/api.go writes a bare 200 and a bare
  # 204), and a default that can never fire is a promise the client codes
  # against. /v1/login does have one, and declares it.
  /v1/version:
    get:
      security: []
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
  /v1/status:
    get:
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/sandboxes:
    get:
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/SandboxList" } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image: { type: string }
                ttl: { type: [string, "null"], description: "like 1h; null keeps it until killed; absent = default" }
                network: { type: string, enum: [internet, none] }
                cpu: { type: string }
                memory: { type: string }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Sandbox" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Sandbox" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      responses:
        "204": { description: killed }
        default: { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/exec:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd]
              properties:
                cmd: { type: string }
                timeout: { type: [number, "null"], description: seconds; null = no limit }
                background: { type: boolean }
                env: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ExecResult" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/fork:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 10 }
                ttl: { type: [string, "null"] }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/SandboxList" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/extend:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl]
              properties:
                ttl: { type: [string, "null"], description: null keeps it until killed }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Sandbox" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/start:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Sandbox" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/files:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: path, in: query, required: true, schema: { type: string }, description: relative to /workspace }
    get:
      responses:
        "200": { description: file bytes, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      requestBody:
        required: true
        description: up to 100 MB
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: written }
        default: { $ref: "#/components/responses/Error" }

  /v1/login:
    post:
      security: []
      parameters: [{ name: X-Dawnbx, in: header, required: true, schema: { type: string, enum: ["1"] } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: signed in; sets the session cookie, content: { application/json: { schema: { $ref: "#/components/schemas/Principal" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/logout:
    post:
      security: []
      responses:
        "204": { description: signed out }
  /v1/me:
    get:
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Principal" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/me/password:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, new]
              properties:
                old: { type: string }
                new: { type: string, minLength: 10, maxLength: 72 }
      responses:
        "204": { description: changed; every session of the user ends }
        default: { $ref: "#/components/responses/Error" }

  /v1/keys:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [keys], properties: { keys: { type: array, items: { $ref: "#/components/schemas/Key" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                ttl: { type: string, description: 'Go duration like "720h"; empty = never expires' }
                org: { type: string, description: admins only }
      responses:
        "200":
          description: the token is shown only here
          content:
            application/json:
              schema: { type: object, required: [key, info], properties: { key: { type: string }, info: { $ref: "#/components/schemas/Key" } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/keys/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    delete:
      responses:
        "204": { description: revoked }
        default: { $ref: "#/components/responses/Error" }
  /v1/audit:
    get:
      responses:
        "200":
          description: latest 200 events
          content:
            application/json:
              schema: { type: object, required: [events], properties: { events: { type: array, items: { $ref: "#/components/schemas/Event" } } } }
        default: { $ref: "#/components/responses/Error" }

  /v1/orgs:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [orgs], properties: { orgs: { type: array, items: { $ref: "#/components/schemas/Org" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,39}$" }
                name: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/users:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [users], properties: { users: { type: array, items: { $ref: "#/components/schemas/User" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 10, maxLength: 72 }
                org: { type: string }
                role: { type: string, enum: [member, admin] }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/users/{username}:
    parameters: [{ $ref: "#/components/parameters/username" }]
    delete:
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/users/{username}/password:
    parameters: [{ $ref: "#/components/parameters/username" }]
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 10, maxLength: 72 }
      responses:
        "204": { description: changed }
        default: { $ref: "#/components/responses/Error" }

  /v1/nodes:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [nodes], properties: { nodes: { type: array, items: { $ref: "#/components/schemas/Node" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/nodes/join:
    get:
      responses:
        "200":
          description: install command for a new worker (audited)
          content:
            application/json:
              schema: { type: object, required: [command], properties: { command: { type: string } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/nodes/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    delete:
      responses:
        "204": { description: removed }
        default: { $ref: "#/components/responses/Error" }

  /v1/control-plane:
    get:
      description: >
        Capability probe. Tells the dashboard which navigation to render; a
        cluster returns control_plane false.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlPlane" }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers:
    get:
      description: Providers this control plane can provision with. Phase one is AWS only.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers/{provider}/regions:
    parameters: [{ $ref: "#/components/parameters/provider" }]
    get:
      description: >
        Regions the named provider can provision in with the control plane's
        configured credential source. A provider that is not available in
        phase one is 400 provider_unavailable, never an empty list.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [regions]
                properties:
                  regions: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers/{provider}/instance-types:
    parameters: [{ $ref: "#/components/parameters/provider" }]
    get:
      description: >
        Host sizes the named provider offers, with the current price for a
        region. Omit `region` and the provider's first advertised one is used, so
        the answer is indicative rather than authoritative; the estimate, which
        is priced for the region you name, is what governs. The list comes from
        the provider adapter, never from a table in this contract.
      parameters:
        - name: region
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [instance_types, region]
                properties:
                  region:
                    type: string
                    description: >
                      The region these prices are for. One fact about the whole
                      response, not one per item, because a size is a catalogue
                      entry and the region was the argument to fetching it.
                  instance_types:
                    type: array
                    items: { $ref: "#/components/schemas/InstanceTypePrice" }
        default: { $ref: "#/components/responses/Error" }

  /v1/providers/{provider}/estimate:
    parameters: [{ $ref: "#/components/parameters/provider" }]
    post:
      description: >
        Estimate the fixed charges for a configuration with the named provider.
        Creates nothing. The returned quote_id must be presented to
        POST /v1/clusters, which is what makes the price review the gate on
        spending money.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [region, instance_type, disk_gib]
              properties:
                region: { type: string }
                instance_type: { type: string }
                disk_gib: { type: integer, minimum: 20 }
                domain: { type: string, default: "" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters:
    get:
      description: Clusters this control plane manages. Never includes credentials.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }
    post:
      description: >
        Start provisioning a cluster. Returns the cluster in status provisioning;
        the dashboard polls GET /v1/clusters/{name} for phase changes.

        409 quote_stale when the presented quote_id is not the one this
        configuration would produce, which is the price review refusing to be
        skipped or to apply to a different configuration. 400
        provider_unavailable when this control plane has no usable provider.
        400 invalid_request for a name, region, size or disk the provider does
        not offer, and for an unknown field - a misspelled one must not read as
        a default in a request that spends money.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, region, instance_type, disk_gib, quote_id]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$" }
                region: { type: string }
                instance_type: { type: string }
                disk_gib: { type: integer, minimum: 20 }
                domain: { type: string, default: "" }
                quote_id:
                  type: string
                  description: "from POST /v1/providers/{provider}/estimate"
      responses:
        "200":
          description: the cluster, provisioning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      description: >
        Delete the cluster and its resources. 409 when workers are still present.
        Also used by automatic cleanup after a failed provisioning operation.
        Returns the cluster in status deleting, because the operator is told
        what is happening rather than left to guess.
      responses:
        "200":
          description: the cluster, deleting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/credentials:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    get:
      description: >
        The cluster's API key and administrator password, in plaintext. Admin
        only, audited as cluster.credentials.view, and the only response in the
        API that returns a secret. This is the route that replaces reading them
        off the host over SSH. The key is minted by the cluster itself once it
        accepts the injected password, so this returns 409 until the cluster
        reaches status ready.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterCredentials" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/rotate:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    post:
      description: >
        Mint a new administrator password and API key and re-deliver the password
        to the provider's secret channel. The cluster's previous API key is
        revoked in the same call; its previous password cannot be, because the
        running cluster only learns a new one when an operator applies it, and
        that is what stops a rotation locking everyone out. Admin only, audited.
      responses:
        "200":
          description: the rotated cluster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/nodes:
    parameters: [{ $ref: "#/components/parameters/clusterName" }]
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/ClusterNode" }
        default: { $ref: "#/components/responses/Error" }
    post:
      description: >
        Add a worker. 503 cluster_unavailable while the cluster is not ready.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [instance_type, disk_gib]
              properties:
                instance_type: { type: string }
                disk_gib: { type: integer, minimum: 20 }
      responses:
        "200":
          description: the node, provisioning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterNode" }
        default: { $ref: "#/components/responses/Error" }

  /v1/clusters/{name}/nodes/{node}:
    parameters:
      - { $ref: "#/components/parameters/clusterName" }
      - { name: node, in: path, required: true, schema: { type: string } }
    delete:
      description: >
        Remove a worker. 409 node_holds_sandboxes when it still holds
        sandboxes, with the count in the message.
      responses:
        "204": { description: removed }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    cookie: { type: apiKey, in: cookie, name: dawnbx_session }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    username: { name: username, in: path, required: true, schema: { type: string } }
    clusterName: { name: name, in: path, required: true, schema: { type: string } }
    provider:
      name: provider
      in: path
      required: true
      description: >
        A provider this build can provision with. Not an enum: the contract's own
        rule is that an unavailable one answers 400 provider_unavailable rather
        than an empty result, and a type that rejected the value would make that
        400 unreachable from a generated client.
      schema: { type: string }
  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        hint: { type: string }
    Version:
      type: object
      required: [version, api]
      properties: { version: { type: string }, api: { type: string } }
    Status:
      type: object
      required: [version, free_pct, warm, pool_size]
      properties:
        version: { type: string }
        free_pct: { type: number }
        warm: { type: integer }
        pool_size: { type: integer }
    Sandbox:
      type: object
      required: [id, image, status, network, created, expires_at, restarted_at, org]
      properties:
        id: { type: string }
        image: { type: string }
        status: { type: string, enum: [running, stopped, deleting] }
        reason: { type: string, description: why it stopped }
        parent: { type: string }
        network: { type: string }
        created: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: null = kept until killed }
        restarted_at: { type: [string, "null"], format: date-time }
        org: { type: string }
        node: { type: string }
        warnings: { type: array, items: { type: string } }
    SandboxList:
      type: object
      required: [sandboxes]
      properties: { sandboxes: { type: array, items: { $ref: "#/components/schemas/Sandbox" } } }
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr]
      properties:
        exit_code: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
        pid: { type: integer, description: background only }
        log: { type: string, description: background only }
    Principal:
      type: object
      required: [org, admin]
      properties:
        org: { type: string }
        user: { type: string, description: dashboard sessions }
        key_id: { type: string, description: API keys }
        admin: { type: boolean }
    Key:
      type: object
      required: [id, org, name, created, created_by, last_used, expires, revoked]
      properties:
        id: { type: string }
        org: { type: string }
        name: { type: string }
        created: { type: string, format: date-time }
        created_by: { type: string }
        last_used: { type: [string, "null"], format: date-time }
        expires: { type: [string, "null"], format: date-time }
        revoked: { type: [string, "null"], format: date-time }
    Event:
      type: object
      required: [at, org, actor, action, target]
      properties:
        at: { type: string, format: date-time }
        org: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
    Org:
      type: object
      required: [id, name, created]
      properties:
        id: { type: string }
        name: { type: string }
        created: { type: string, format: date-time }
    User:
      type: object
      required: [id, org, username, role, created]
      properties:
        id: { type: string }
        org: { type: string }
        username: { type: string }
        role: { type: string, enum: [member, admin] }
        created: { type: string, format: date-time }
    Node:
      type: object
      required: [name, role, ready, since, heartbeat, ip, kubelet, sandboxes]
      properties:
        name: { type: string }
        role: { type: string, enum: [server, worker] }
        ready: { type: boolean }
        since: { type: string, format: date-time, description: last Ready change }
        heartbeat: { type: string, format: date-time }
        ip: { type: string }
        kubelet: { type: string }
        sandboxes: { type: integer }
    ControlPlane:
      type: object
      required: [control_plane, providers, version]
      properties:
        control_plane: { type: boolean, description: true on a control plane, false on a cluster }
        providers: { type: array, items: { type: string } }
        version: { type: string }

    Provider:
      type: object
      required: [id, available]
      properties:
        id: { type: string, description: "aws | gcp | azure" }
        available: { type: boolean, description: false means the choice is visible but cannot provision }
        delivery:
          type: string
          description: >
            How a credential reaches a new host on this provider, in the
            provider's own words. The guarantee differs by cloud - a cloud with no
            secret store an instance can read cannot keep the value out of the
            creation payload - so an operator is told which they are getting
            rather than the strongest thing the product does anywhere. Empty on a
            provider this build cannot use, because it cannot deliver anything.

    InstanceTypePrice:
      type: object
      required: [id, hourly_usd, monthly_usd]
      properties:
        id: { type: string }
        hourly_usd: { type: number }
        monthly_usd: { type: number }

    Estimate:
      type: object
      required: [quote_id, hourly_usd, monthly_usd, lines, excluded]
      properties:
        quote_id: { type: string, description: present this to POST /v1/clusters }
        hourly_usd: { type: number }
        monthly_usd: { type: number }
        lines:
          type: array
          description: fixed charges only, one row per resource
          items:
            type: object
            required: [label, hourly_usd, monthly_usd]
            properties:
              label: { type: string, description: "compute | storage | public_ipv4" }
              hourly_usd: { type: number }
              monthly_usd: { type: number }
        excluded:
          type: array
          description: charges deliberately not estimated, shown so the operator is not surprised
          items: { type: string }

    Cluster:
      type: object
      required: [name, provider, region, instance_type, disk_gib, domain, status, phase, detail, hourly_usd, monthly_usd, url, tls_pin, created, updated]
      properties:
        name: { type: string }
        provider: { type: string, description: the provider id; only aws is available in phase one }
        region: { type: string }
        instance_type: { type: string }
        disk_gib: { type: integer }
        domain: { type: string }
        status:
          type: string
          enum: [provisioning, ready, failed, deleting]
        phase: { type: string, description: current sub-step; empty unless provisioning }
        detail: { type: string, description: non-secret diagnostic from the bootstrap }
        hourly_usd: { type: number }
        monthly_usd: { type: number }
        url: { type: string, description: non-empty only when status is ready }
        tls_pin: { type: string, description: SHA-256 SPKI pin of the cluster certificate }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }

    ClusterCredentials:
      type: object
      required: [api_key, admin_password]
      properties:
        api_key: { type: string }
        admin_password: { type: string }
      description: >
        The only response in the API that returns plaintext secrets. Admin only,
        audited, and never included in a list.

    ClusterNode:
      type: object
      required: [id, instance_type, status, sandboxes, created]
      properties:
        id:
          type: string
          description: >
            Opaque worker handle from the provider, typed back into
            DELETE /v1/clusters/{name}/nodes/{node}. Returned to the
            operator because the removal URL needs it; never parsed
            or interpreted by the control plane.
        instance_type: { type: string }
        status:
          type: string
          enum: [provisioning, ready, failed]
          description: >
            A worker is only ever provisioning, ready or failed. `removing` and
            `removed` were in the contract but nothing wrote them - a removal
            drops the row and returns 204 - and the dashboard polled on
            `removing`, so the enum claimed a state the page was waiting for
            that could never arrive.
        detail: { type: string }
        sandboxes: { type: integer, description: last observed count; the cluster is the authority }
        created: { type: string, format: date-time }
