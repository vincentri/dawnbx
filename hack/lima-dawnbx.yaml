# Dev bench VM: Ubuntu 24.04 + a raw second disk that install.sh formats
# with ext4 project quota (same path as a VPS with an attached volume).
base: template:ubuntu-24.04
vmType: vz
cpus: 2
memory: 4GiB
disk: 40GiB
mounts: []
# user-v2 puts VMs on 192.168.104.0/24 where they reach each other (--join tests);
# no host daemon needed (vzNAT got no DHCP lease on some Macs).
networks:
  - lima: user-v2
additionalDisks:
  - name: dawnbxdata
    format: false
