[project]
name = "dawnbx"
version = "0.1.0"
description = "Python SDK for dawnbx: self-hosted sandboxes for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests import the SDK from src via sys.path, which is E402 by design.
"tests/*" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
